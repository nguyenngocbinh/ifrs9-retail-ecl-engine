name: SQL Server 2022 integration tests

on:
  pull_request:
    paths:
      - "database/**"
      - "tests/sql/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "database/**"
      - "tests/sql/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-server-2022:
    name: Deploy migrations and run tests on SQL Server 2022
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          SA_PASSWORD: "CI_SQL_2022_Test!Only2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/1433' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 60s

    env:
      SQLSERVER_TEST_PASSWORD: "CI_SQL_2022_Test!Only2026"
      SQLSERVER_TEST_DATABASE: IFRS9_ECL_CI_${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlcmd
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server and verify version
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if sqlcmd -S localhost,1433 -U sa -P "$SQLSERVER_TEST_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('ProductMajorVersion') AS int)" -h -1 -W; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "SQL Server did not become ready in time."
              exit 1
            fi
            sleep 10
          done
          version=$(sqlcmd -S localhost,1433 -U sa -P "$SQLSERVER_TEST_PASSWORD" -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('ProductMajorVersion') AS int)" | tr -d '[:space:]')
          if [ "$version" != "16" ]; then
            echo "Expected SQL Server 2022 major version 16; got: $version"
            exit 1
          fi

      - name: Create isolated test database
        shell: bash
        run: |
          set -euo pipefail
          sqlcmd -S localhost,1433 -U sa -P "$SQLSERVER_TEST_PASSWORD" -C -b -Q "CREATE DATABASE [$SQLSERVER_TEST_DATABASE]"

      - name: Deploy migrations and run all SQL tests
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            "database/001_create_logical_schema.sql"
            "database/002_run_control.sql"
            "database/003_input_validation.sql"
            "tests/sql/run_control_smoke_tests.sql"
            "tests/sql/input_validation_smoke_tests.sql"
            "database/004_input_reconciliation.sql"
            "tests/sql/input_reconciliation_smoke_tests.sql"
            "database/005_ecl_calculation.sql"
            "database/006_ead_curve_loader.sql"
            "tests/sql/ead_curve_loader_tests.sql"
            "tests/sql/input_contract_regression_tests.sql"
            "tests/sql/maturity_curve_coverage_tests.sql"
            "tests/sql/canonical_input_happy_path_tests.sql"
            "tests/sql/scenario_weight_boundary_tests.sql"
            "tests/sql/run_lifecycle_gate_tests.sql"
            "tests/sql/precalculation_rerun_safety_tests.sql"
            "tests/sql/publication_gate_tests.sql"
            "tests/sql/selective_run_scope_tests.sql"
            "tests/sql/input_data_quality_tests.sql"
            "tests/sql/ecl_calculation_tests.sql"
            "tests/sql/ecl_calculation_rollback_fault_injection_tests.sql"
          )
          for script in "${scripts[@]}"; do
            echo "Running $script"
            sqlcmd -S localhost,1433 -U sa -P "$SQLSERVER_TEST_PASSWORD" -C -b -d "$SQLSERVER_TEST_DATABASE" -i "$script"
          done

      - name: Drop isolated test database
        if: always()
        shell: bash
        run: |
          if [ -n "${SQLSERVER_TEST_DATABASE:-}" ] && command -v sqlcmd >/dev/null 2>&1; then
            sqlcmd -S localhost,1433 -U sa -P "$SQLSERVER_TEST_PASSWORD" -C -b -Q "IF DB_ID(N'$SQLSERVER_TEST_DATABASE') IS NOT NULL BEGIN ALTER DATABASE [$SQLSERVER_TEST_DATABASE] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [$SQLSERVER_TEST_DATABASE]; END" || echo "::warning::Could not drop the CI database; it will be removed with the disposable service container."
          fi
