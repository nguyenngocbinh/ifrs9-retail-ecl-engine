name: SQL Server integration tests

on:
  pull_request:
    paths:
      - "database/**"
      - "tests/sql/**"
      - ".github/workflows/sql-server-tests.yml"
  push:
    branches: [main]
    paths:
      - "database/**"
      - "tests/sql/**"
      - ".github/workflows/sql-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-server-integration:
    name: Deploy migrations and run SQL smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2017-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "CiOnly_StrongPassw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "(/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'CiOnly_StrongPassw0rd!' -Q 'SELECT 1' || exit 1)"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      SQLSERVER_PASSWORD: "CiOnly_StrongPassw0rd!"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlcmd client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if sqlcmd -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not become ready in time." >&2
          exit 1

      - name: Create disposable test database
        run: |
          sqlcmd -b -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -Q "CREATE DATABASE IFRS9_ECL_CI;"

      - name: Deploy logical schema migration
        run: |
          sqlcmd -b -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -d IFRS9_ECL_CI -i database/001_create_logical_schema.sql

      - name: Deploy run-control migration
        run: |
          sqlcmd -b -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -d IFRS9_ECL_CI -i database/002_run_control.sql

      - name: Deploy input validation migration
        run: |
          sqlcmd -b -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -d IFRS9_ECL_CI -i database/003_input_validation.sql

      - name: Run transactional lifecycle smoke tests
        run: |
          sqlcmd -b -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -d IFRS9_ECL_CI -i tests/sql/run_control_smoke_tests.sql

      - name: Run input validation negative-path tests
        run: |
          sqlcmd -b -C -S localhost,1433 -U sa -P "$SQLSERVER_PASSWORD" -d IFRS9_ECL_CI -i tests/sql/input_validation_smoke_tests.sql
